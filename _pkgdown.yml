url: https://werkstattcodes.github.io/risAT
template:
  bootstrap: 5
  light-switch: true
  bslib:
    bootswatch: materia
    pkgdown-navbar-bg: "#FFFFFF"

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github, lightswitch]

articles:
  - title: "Getting started"
    navbar: ~
    contents:
      - articles/getting-started
      - risat-intro

external-articles:
  - name: risat-intro
    title: "Introducing risAT"
    description: "An introduction to risAT and working with Austrian legal information in R."
    href: https://werk.statt.codes/posts/2026-06-30-risat-intro/

reference:
  - title: "Search Functions — Generic"
    desc: "Search across all Judikatur applications with a single function."
    contents:
      - ris_search_case_law

  - title: "Search Functions — Court Wrappers"
    desc: "Convenience wrappers pre-filled with a specific application code."
    contents:
      - ris_search_vfgh
      - ris_search_vwgh
      - ris_search_justiz
      - ris_search_bvwg
      - ris_search_lvwg
      - ris_search_dsk
      - ris_search_dok
      - ris_search_pvak
      - ris_search_gbk

  - title: "Search Functions — Bundesrecht"
    desc: "Search consolidated federal law (Bundesrecht in konsolidierter Fassung, BrKons)."
    contents:
      - ris_search_federal

  - title: "Request Building"
    contents:
      - ris_req_case_law
      - ris_perform_case_law
      - ris_req_federal
      - ris_perform_federal

  - title: "Parsers"
    contents:
      - ris_parse_search
      - ris_parse_federal

  - title: "Utilities"
    desc: "API base URL and RIS website URL accessors."
    contents:
      - ris_base_url
      - ris_search_url

build:
  exclude:
    - AGENTS.md
    - CLAUDE.md

authors:
  Roland Schmidt:
    href: https://werk.statt.codes
