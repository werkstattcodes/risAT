url: https://werkstattcodes.github.io/risAT
template:
  bootstrap: 5
  light-switch: true
  includes:
    before_title: pkgdown/includes/lifecycle-badge.html
  bslib:
    bootswatch: materia
    pkgdown-navbar-bg: "#FFFFFF"

navbar:
  structure:
    left: [intro, reference, news]
    right: [search, github, lightswitch]

reference:
  - title: "Search Functions — Generic"
    desc: "Search across all Judikatur applications with a single function."
    contents:
      - ris_search_case_law

  - title: "Search Functions — Court Wrappers"
    desc: "Convenience wrappers pre-filled with a specific application code."
    contents:
      - ris_search_vfgh
      - ris_search_vwgh
      - ris_search_justiz
      - ris_search_bvwg
      - ris_search_lvwg
      - ris_search_dsk
      - ris_search_dok
      - ris_search_pvak
      - ris_search_gbk

  - title: "Request Building"
    contents:
      - ris_req_case_law
      - ris_perform_case_law

  - title: "Parsers"
    contents:
      - ris_parse_search

build:
  exclude:
    - AGENTS.md
    - CLAUDE.md

authors:
  Roland Schmidt:
    href: https://werk.statt.codes
